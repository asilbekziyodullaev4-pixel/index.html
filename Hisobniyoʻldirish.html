<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hisobni to'ldirish - Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome piktogrammalari -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0c101d; color: white; font-family: sans-serif; }
  </style>
</head>
<body class="p-4 pb-28 max-w-md mx-auto relative min-h-screen select-none">

  <!-- Yuqori qism (Orqaga va Balans) -->
  <div class="flex items-center justify-between mb-3">
    <button class="flex items-center gap-1.5 bg-[#151c2e] px-3 py-1.5 rounded-full text-sm font-medium border border-gray-800">
      <i class="fa-solid fa-arrow-left text-xs"></i>
      <span>Orqaga</span>
    </button>

    <div class="flex items-center gap-1 bg-[#151c2e] px-3 py-1.5 rounded-full border border-gray-800">
      <div class="w-4 h-4 bg-amber-400 rounded-full"></div>
      <span class="font-bold text-sm">0</span>
    </div>
  </div>

  <!-- Profil ma'lumotlari -->
  <div class="flex items-center gap-3 mb-4">
    <div class="w-10 h-10 rounded-full overflow-hidden border border-yellow-500">
      <img src="https://via.placeholder.com/40" alt="Avatar" class="w-full h-full object-cover">
    </div>
    <div>
      <h2 class="font-bold text-base leading-tight">gift</h2>
      <p class="text-xs text-gray-400">@Lemineus</p>
    </div>
  </div>

  <!-- Sarlavha va Sub-sarlavha -->
  <h1 class="text-xl font-bold mb-1">Hisobni to'ldirish</h1>
  <p class="text-xs text-gray-400 mb-4">To'lov usulini tanlang</p>

  <!-- Qo'llanma (Telegraph) Bloki -->
  <div class="bg-[#13192e] border border-blue-900/40 rounded-2xl p-3.5 mb-5 flex items-center justify-between cursor-pointer hover:bg-[#18203b] transition">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-blue-900/50 flex items-center justify-center text-blue-300">
        <i class="fa-solid fa-book-open text-base"></i>
      </div>
      <span class="font-bold text-sm text-blue-200">Qo'llanma</span>
    </div>
    <span class="text-xs text-gray-400 font-medium">Telegraph</span>
  </div>

  <!-- To'lov Usullari Tarmog'i (Grid) -->
  <div class="grid grid-cols-3 gap-3">

    <!-- UzQR Tezkor -->
    <button class="bg-white text-gray-900 rounded-2xl p-3 flex flex-col items-center justify-center h-28 shadow-md active:scale-95 transition">
      <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-white mb-2 font-bold text-xs">
        UzQR
      </div>
      <span class="text-[11px] font-semibold text-center leading-tight">UzQR Tezkor</span>
    </button>

    <!-- SBP -->
    <button class="bg-white text-gray-900 rounded-2xl p-3 flex flex-col items-center justify-center h-28 shadow-md active:scale-95 transition">
      <div class="w-12 h-12 flex items-center justify-center mb-2">
        <span class="text-emerald-600 font-extrabold text-sm">сбп</span>
      </div>
      <span class="text-[11px] font-semibold text-center leading-tight">SBP</span>
    </button>

    <!-- Telegram Stars -->
    <button class="bg-white text-gray-900 rounded-2xl p-3 flex flex-col items-center justify-center h-28 shadow-md active:scale-95 transition">
      <div class="w-12 h-12 bg-indigo-950 rounded-xl flex items-center justify-center mb-2">
        <i class="fa-solid fa-star text-amber-400 text-xl"></i>
      </div>
      <span class="text-[11px] font-semibold text-center leading-tight">Telegram Stars</span>
    </button>

    <!-- UzQR (Texnik ish) -->
    <div class="bg-[#242b3d] text-gray-400 rounded-2xl p-3 flex flex-col items-center justify-center h-28 opacity-60 relative cursor-not-allowed">
      <div class="w-10 h-10 rounded-lg bg-gray-700/50 flex items-center justify-center mb-2 text-xs font-bold text-gray-300">
        UzQR
      </div>
      <span class="bg-[#151c2e] text-[9px] px-1.5 py-0.5 rounded text-gray-300 absolute top-11 font-medium">Texnik ish</span>
      <span class="text-[11px] font-semibold text-center leading-tight mt-1">UzQR</span>
    </div>

    <!-- BANKOMAT (Texnik ish) -->
    <div class="bg-[#242b3d] text-gray-400 rounded-2xl p-3 flex flex-col items-center justify-center h-28 opacity-60 relative cursor-not-allowed">
      <div class="w-10 h-10 rounded-lg bg-gray-700/50 flex items-center justify-center mb-2 text-xs font-bold text-gray-300">
        <i class="fa-solid fa-vault"></i>
      </div>
      <span class="bg-[#151c2e] text-[9px] px-1.5 py-0.5 rounded text-gray-300 absolute top-11 font-medium">Texnik ish</span>
      <span class="text-[11px] font-semibold text-center leading-tight mt-1">BANKOMAT</span>
    </div>

  </div>

  <!-- Pastki Menyu -->
  <div class="fixed bottom-3 left-4 right-4 bg-[#121727]/90 backdrop-blur-md rounded-full p-1.5 border border-gray-800/80 flex justify-between items-center px-3 shadow-2xl">
    <button class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] px-2 py-1">
      <i class="fa-solid fa-box text-sm mb-0.5"></i>
      <span>Bosh sahifa</span>
    </button>

    <button class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] px-2 py-1">
      <i class="fa-solid fa-clock-rotate-left text-sm mb-0.5"></i>
      <span>Tarix</span>
    </button>

    <button class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] px-2 py-1">
      <i class="fa-solid fa-user text-sm mb-0.5"></i>
      <span>Sozlamalar</span>
    </button>

    <button class="flex flex-col items-center text-amber-400 text-[10px] px-2 py-1">
      <i class="fa-solid fa-gamepad text-sm mb-0.5"></i>
      <span>Ijaraga</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
  </script>
</body>
</html>
