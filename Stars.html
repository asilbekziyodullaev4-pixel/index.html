<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TG STARS - Mini App</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome piktogrammalari -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0e19; color: white; font-family: sans-serif; }
  </style>
</head>
<body class="p-4 pb-28 max-w-md mx-auto relative min-h-screen select-none">

  <!-- Yuqori qism (Orqaga tugmasi) -->
  <div class="flex items-center justify-between mb-4">
    <button class="flex items-center gap-1.5 bg-[#151c2e] px-3 py-1.5 rounded-full text-sm font-medium border border-gray-800">
      <i class="fa-solid fa-arrow-left text-xs"></i>
      <span>Orqaga</span>
    </button>
  </div>

  <!-- Banner Card -->
  <div class="bg-[#131929] rounded-2xl p-3 border border-gray-800/80 flex items-center gap-3 mb-5">
    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-indigo-900 to-purple-950 border border-amber-500/30 flex flex-col items-center justify-center shrink-0">
      <i class="fa-solid fa-star text-amber-400 text-lg"></i>
      <span class="text-[8px] font-black tracking-widest text-amber-300 -mt-1">STARS</span>
    </div>
    <div class="flex items-center gap-1.5">
      <h2 class="font-bold text-base tracking-wide">TG STARS</h2>
      <i class="fa-solid fa-star text-amber-400 text-xs"></i>
    </div>
  </div>

  <!-- USERNAME Kiritish Bloki -->
  <div class="mb-5">
    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block px-1">@USERNAME</span>
    <div class="flex gap-2">
      <div class="relative flex-1">
        <input 
          type="text" 
          placeholder="@username" 
          class="w-full bg-[#131929] border border-gray-800 rounded-2xl py-3 px-4 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-blue-600 transition"
        >
      </div>
      <button class="bg-[#1e295d] hover:bg-blue-700 text-blue-200 text-xs font-semibold px-5 py-3 rounded-2xl transition">
        Tekshirish
      </button>
    </div>
  </div>

  <!-- IXTIYORIY SUMMA Bloki -->
  <div class="mb-5">
    <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block px-1">IXTIYORIY SUMMA</span>
    
    <div class="bg-[#131929] border border-gray-800/80 rounded-3xl p-4 space-y-3">
      
      <!-- Summani kiritish field -->
      <div>
        <span class="text-[11px] font-medium text-gray-400 mb-1.5 block">Summani kiriting (<i class="fa-solid fa-star text-amber-400 text-[10px]"></i>)</span>
        <div class="relative flex items-center">
          <input 
            id="starsInput"
            type="number" 
            placeholder="0" 
            class="w-full bg-[#0d1222] border border-gray-800 rounded-2xl py-3 px-4 text-sm font-bold text-white placeholder-gray-500 focus:outline-none focus:border-blue-600 transition"
            oninput="calculatePrice()"
          >
          <i class="fa-solid fa-star text-amber-400 absolute right-4 text-sm"></i>
        </div>
      </div>

      <!-- Narx field -->
      <div class="bg-[#0d1222] border border-gray-800 rounded-2xl py-3 px-4 flex justify-between items-center">
        <span class="text-xs font-bold text-gray-400 uppercase">NARX</span>
        <span id="priceDisplay" class="text-xs font-bold text-gray-300">—</span>
      </div>

      <!-- Minimal va Kurs ma'lumotlari -->
      <div class="pt-1 text-[11px] text-gray-400 space-y-0.5">
        <div>1 <i class="fa-solid fa-star text-amber-400 text-[10px]"></i> = 250 so'm</div>
        <div>Minimal summa: 50 <i class="fa-solid fa-star text-amber-400 text-[10px]"></i></div>
      </div>

    </div>
  </div>

  <!-- Pastki Sotib olish tugmasi -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-[#0b0e19]/90 backdrop-blur-md border-t border-gray-800/50 max-w-md mx-auto">
    <button class="w-full bg-[#1e3a9e] hover:bg-blue-600 text-white font-bold py-3.5 rounded-full transition shadow-lg active:scale-95 text-sm">
      Sotib olish
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function calculatePrice() {
      const input = document.getElementById('starsInput').value;
      const display = document.getElementById('priceDisplay');
      
      if (input && input > 0) {
        const total = input * 250;
        display.innerText = total.toLocaleString('uz-UZ') + " so'm";
        display.classList.add('text-blue-400');
        display.classList.remove('text-gray-300');
      } else {
        display.innerText = "—";
        display.classList.remove('text-blue-400');
        display.classList.add('text-gray-300');
      }
    }
  </script>
</body>
</html>
