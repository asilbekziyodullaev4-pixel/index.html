<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarix - Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0c101d; color: white; font-family: sans-serif; }
    /* Gorizontal scrollbar-ni yashirish */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="p-4 pb-24 max-w-md mx-auto relative min-h-screen select-none flex flex-col justify-between">

  <div>
    <div class="flex items-center justify-between mb-2">
      <button class="flex items-center gap-1.5 bg-[#151c2e] px-3 py-1.5 rounded-full text-sm font-medium border border-gray-800">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>Orqaga</span>
      </button>

      <div class="flex items-center gap-1 bg-[#151c2e] px-3 py-1.5 rounded-full border border-gray-800">
        <div class="w-4 h-4 bg-amber-400 rounded-full"></div>
        <span class="font-bold text-sm">0</span>
      </div>
    </div>

    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-full overflow-hidden border border-yellow-500">
        <img src="https://via.placeholder.com/40" alt="Avatar" class="w-full h-full object-cover">
      </div>
      <div>
        <h2 class="font-bold text-base leading-tight">gift</h2>
        <p class="text-xs text-gray-400">@Lemineus</p>
      </div>
    </div>

    <h1 class="text-xl font-bold mb-4">Tarix</h1>

    <div class="bg-[#121727] p-1 rounded-full border border-gray-800/80 grid grid-cols-2 mb-4">
      <button class="bg-[#2b3990] text-white py-2 rounded-full text-sm font-semibold text-center transition">
        Buyurtmalar
      </button>
      <button class="text-gray-400 hover:text-white py-2 rounded-full text-sm font-semibold text-center transition">
        Moliya
      </button>
    </div>

    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-12">
      <button class="bg-[#1d4ed8] text-white px-5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">
        Barchasi
      </button>
      <button class="bg-[#151c2e] text-gray-400 border border-gray-800/80 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">
        Bajarildi
      </button>
      <button class="bg-[#151c2e] text-gray-400 border border-gray-800/80 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">
        Kutilmoqda
      </button>
      <button class="bg-[#151c2e] text-gray-400 border border-gray-800/80 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap">
        Bekor qilindi
      </button>
    </div>

    <div class="flex justify-center items-center my-16">
      <p class="text-gray-500 text-sm font-medium">Tranzaksiyalar yo'q</p>
    </div>
  </div>

  <div class="fixed bottom-3 left-4 right-4 bg-[#121727]/90 backdrop-blur-md rounded-full p-1.5 border border-gray-800/80 flex justify-between items-center px-3 shadow-2xl">
    <button class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] px-2 py-1">
      <i class="fa-solid fa-box text-sm mb-0.5"></i>
      <span>Bosh sahifa</span>
    </button>

    <button class="flex items-center gap-2 bg-[#2b3990] text-white px-4 py-2 rounded-full text-xs font-bold">
      <i class="fa-solid fa-clock-rotate-left text-sm"></i>
      <span>Tarix</span>
    </button>

    <button class="flex flex-col items-center text-gray-400 hover:text-white text-[10px] px-2 py-1">
      <i class="fa-solid fa-user text-sm mb-0.5"></i>
      <span>Sozlamalar</span>
    </button>

    <button class="flex flex-col items-center text-amber-400 text-[10px] px-2 py-1">
      <i class="fa-solid fa-gamepad text-sm mb-0.5"></i>
      <span>Ijaraga</span>
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
  </script>
</body>
</html>
